services:
  - type: web
    name: natuchat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: natuchat-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_HOST
        fromService:
          type: web
          name: natuchat-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME