services:
  backend:
    build: ./backend
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      PORT: 8080
      WS_URL: ${WS_URL:-}
    ports:
      - "8080:8080"
    restart: unless-stopped